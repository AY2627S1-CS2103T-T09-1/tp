<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-labelledby="title desc">
  <title id="title">Person, Subject, and Band class diagram</title>
  <desc id="desc">A Person contains one to eight Subject objects. Each Subject has one Band, which is G1, G2, or G3.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#9d0012" />
    </marker>
  </defs>
  <rect x="12" y="18" width="876" height="218" rx="2" fill="#fff" stroke="#111" />
  <rect x="394" y="8" width="112" height="24" fill="#fff" />
  <text x="450" y="26" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#111">Model</text>

  <rect x="92" y="105" width="150" height="54" rx="2" fill="#9d0012" />
  <text x="167" y="139" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#fff">Person</text>

  <rect x="372" y="105" width="170" height="54" rx="2" fill="#9d0012" />
  <text x="457" y="139" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#fff">Subject</text>

  <rect x="675" y="82" width="155" height="102" rx="2" fill="#9d0012" />
  <text x="752.5" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#fff">«enumeration»</text>
  <text x="752.5" y="133" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#fff">Band</text>
  <line x1="675" y1="145" x2="830" y2="145" stroke="#fff" stroke-width="1" />
  <text x="752.5" y="168" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#fff">G1 · G2 · G3</text>

  <line x1="258" y1="132" x2="360" y2="132" stroke="#9d0012" stroke-width="2" />
  <polygon points="242,132 250,126 258,132 250,138" fill="#fff" stroke="#9d0012" stroke-width="2" />
  <path d="M360 126 L372 132 L360 138 Z" fill="#9d0012" />
  <text x="252" y="118" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#111">1</text>
  <text x="364" y="118" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#111">1..8</text>
  <text x="307" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#111">subjects</text>

  <line x1="542" y1="132" x2="675" y2="132" stroke="#9d0012" stroke-width="2" marker-end="url(#arrow)" />
  <text x="560" y="118" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#111">*</text>
  <text x="658" y="118" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#111">1</text>
  <text x="609" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#111">band</text>
</svg>
